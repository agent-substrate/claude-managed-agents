apiVersion: v1
kind: Namespace
metadata:
  name: anthropic-worker
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-environment-creds
  namespace: anthropic-worker
stringData:
  ANTHROPIC_ENVIRONMENT_ID: env_REPLACE_WITH_YOUR_ENVIRONMENT_ID
  ANTHROPIC_ENVIRONMENT_KEY: sk-ant-env-REPLACE_WITH_YOUR_ENVIRONMENT_KEY
type: Opaque
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  labels:
    workload: anthropic-worker-template
  name: anthropic-worker-template-workerpool
  namespace: anthropic-worker
spec:
  ateomImage: gcr.io/dberkov-gke-dev3/ate-images/ateom-gvisor-715889664656de67e44382a8d6ab981d@sha256:b0b6e2ad834de42cb2a4c55e83b60243f66cb85ca37575d1a6818e788e0564e0
  replicas: 3
---
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: anthropic-worker-template
  namespace: anthropic-worker
spec:
  containers:
  - command:
    - ant
    - beta:worker
    - poll
    - --workdir
    - /workspace
    env:
    - name: PORT
      value: "8080"
    - name: WORK_DIR
      value: /workspace
    - name: WORKER_MODE
      value: poll
    image: gcr.io/your-project/anthropic-worker:latest
    name: worker
    readyz:
      httpGet:
        path: /readyz
        port: 8080
  pauseImage: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
  snapshotsConfig:
    location: gs://my-substrate-snapshots-bucket/anthropic-worker/
  workerSelector:
    matchLabels:
      workload: anthropic-worker-template
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: anthropic-worker
  name: anthropic-worker
  namespace: anthropic-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anthropic-worker
  template:
    metadata:
      labels:
        app: anthropic-worker
    spec:
      containers:
      - env:
        - name: PORT
          value: "8080"
        - name: WORK_DIR
          value: /workspace
        - name: WORKER_MODE
          value: poll
        envFrom:
        - secretRef:
            name: anthropic-environment-creds
        image: gcr.io/your-project/anthropic-worker:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        name: anthropic-worker
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - mountPath: /workspace
          name: workspace
      volumes:
      - name: workspace
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: anthropic-worker
  name: anthropic-worker
  namespace: anthropic-worker
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: anthropic-worker
